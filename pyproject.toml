[project]
name = "pocket-tts"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Thomas Bellucci", email = "th.bellucci@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "onnxruntime>=1.31.1",
    "pyyaml>=6.0.3",
    "safetensors>=0.8.0",
    "scipy>=1.18.1",
    "sentencepiece>=0.2.3",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
]

[project.scripts]
pocket-tts = "pocket_tts:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
